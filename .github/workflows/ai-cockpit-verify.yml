name: AI Cockpit frontend build
on:
  push:
    branches: [feat/ai-cockpit-visual-rework]
  pull_request:
    paths:
      - 'apps/web/**'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.7.0'
      - run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Export Prettier-formatted Cockpit sources for review
        run: |
          cd apps/web
          npx prettier --write src/App.tsx src/cockpit/CockpitPage.tsx src/cockpit/cockpit-shell.css
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const files = ['src/App.tsx', 'src/cockpit/CockpitPage.tsx', 'src/cockpit/cockpit-shell.css'];
          console.log('COCKPIT_FORMAT_EXPORT=' + JSON.stringify(Object.fromEntries(files.map(p => [p, fs.readFileSync(p, 'utf8')]))));
          EOF
      - run: npm --prefix apps/web run build
      - name: Verify sandboxed cockpit renders with actual Nginx CSP
        run: |
          docker build -f apps/web/Dockerfile -t local-ai-cockpit:test apps/web
          docker run -d --name local-ai-cockpit-test -p 127.0.0.1:5173:8080 local-ai-cockpit:test
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          docker logs local-ai-cockpit-test
          curl -fsSI http://127.0.0.1:5173/
          curl -fsSI http://127.0.0.1:5173/cockpit.html
          cd apps/web
          npx playwright install --with-deps chromium
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto('http://127.0.0.1:5173/', { waitUntil: 'load' });
            const cockpit = page.frameLocator('iframe[title="Local AI — AI Cockpit"]');
            await cockpit.locator('.sidebar').waitFor({ state: 'visible' });
            const bg = await cockpit.locator('body').evaluate(e => getComputedStyle(e).backgroundColor);
            const grid = await cockpit.locator('.shell').evaluate(e => getComputedStyle(e).display);
            const width = await cockpit.locator('.sidebar').evaluate(e => getComputedStyle(e).width);
            console.log(JSON.stringify({ bg, grid, width }));
            if (bg !== 'rgb(9, 13, 20)' || grid !== 'grid' || width !== '234px') {
              throw new Error('Cockpit CSS did not load under production CSP');
            }
            await page.screenshot({ path: '/tmp/cockpit-production.png' });
          } finally {
            await browser.close();
          }
          EOF
      - name: Stop test container
        if: always()
        run: docker rm -f local-ai-cockpit-test || true
