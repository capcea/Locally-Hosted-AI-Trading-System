name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.7.0'
      - run: make setup
      - run: make market-setup
      - run: make repository-check
      - run: make check
      - name: Verify generated API contract is current
        run: make contracts-check
      - name: Compose validation
        run: docker compose config --quiet
      - name: Dependency audit
        run: |
          npm --prefix apps/web audit --audit-level=high
          UV_CACHE_DIR=.cache/uv .tools/bin/uv run --with pip-audit==2.10.1 python -m pip_audit --progress-spinner off
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --redact --no-banner
      - name: Independent read-only connector packaging (no broker connection)
        run: |
          docker build -f services/broker_bridge/Dockerfile -t readonly-bridge:ci .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 768m --pids-limit 64 readonly-bridge:ci --help
      - name: Start complete stack
        run: make dev
      - run: make integration
      - name: Browser paths
        run: |
          cd apps/web
          npx playwright install --with-deps chromium
          cd ../..
          make browser-integration
      - name: Stop stack
        if: always()
        run: docker compose down

