server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    # Request URIs may contain sensitive query values; API emits sanitized JSON logs instead.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/(api/|health/|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    # The Cockpit is intentionally an isolated, script-enabled sandboxed preview.
    # Inline styles/scripts are permitted ONLY for this exact static document,
    # never for the authenticated parent application or API.
    location = /cockpit.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; object-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
